 Spain\",\"description\":\"Development and maintenance of the Company application using React and Redux, ensuring optimal functionality and code quality. Code testing and component optimization/refactoring to improve performance and user experience. Collaboration in the design and implementation of new functionalities.\"},{\"role\":\"GEOACTIO — Front-End developer\",\"company\":\"Aug 2020 – Nov 2021\",\"period\":\"Pamplona/Iruña, Spain\",\"description\":\"Development and maintenance of custom web applications for clients in the transport, energy, and health sectors. Writing clean and maintainable code to meet functional and visual requirements. Review and approval of code developed by the team.\"},{\"role\":\"Freelance\",\"company\":\"Sep 2014 – Aug 2016\",\"period\":\"Camaguey, Cuba\",\"description\":\"Development of websites for rental houses (using WordPress, Symfony, PHP, HTML, CSS, and JavaScript). Optimization of website performance and implementation of user-friendly interfaces to improve user experience. Increased online visibility and bookings through effective web design and SEO strategies.\"},{\"role\":\"Relevant Academic Project (Master's)\",\"company\":\"University of Camagüey\",\"period\":\"Camagüey, Cuba\",\"description\":\"Development of an expert system for the design of sewer registries in Camagüey, Cuba, using ReactJS, Java, and MySQL. Implementation of the SCRUM methodology and collaboration in the integration of Drools and Hibernate.\"}],\"education\":[{\"role\":\"Master in Business Administration - MBA\",\"company\":\"EUDE Business School\",\"period\":\"Jun 2020 – Jul 2021\",\"description\":\"\"},{\"role\":\"Master in Applied Informatics\",\"company\":\"University of Camaguey\",\"period\":\"2016 – 2018\",\"description\":\"\"},{\"role\":\"Engineer in Computer Science\",\"company\":\"University of the Informatic Sciences\",\"period\":\"2007 – 2012\",\"description\":\"\"}]},\"projects\":{\"title\":\"My Projects\",\"intro\":\"Here are some of the p
