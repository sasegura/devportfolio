n y refactorización de componentes previamente desarrollados para mejorar el rendimiento. Implementación de capas de datos en Google Tag Manager para el seguimiento de eventos de usuario en la aplicación Applus.\"},{\"role\":\"op2aim — Frontend-Developer React\",\"company\":\"Noviembre 2021 – Noviembre 2022\",\"period\":\"Madrid, España\",\"description\":\"Desarrollo y mantenimiento de la aplicación Company utilizando React y Redux, garantizando una funcionalidad y calidad de código óptimas. Realización de pruebas de código y optimización/refactorización de componentes para mejorar el rendimiento y la experiencia del usuario. Colaboración en el diseño e implementación de nuevas funcionalidades.\"},{\"role\":\"GEOACTIO — Front-End developer\",\"company\":\"Agosto 2020 – Noviembre 2021\",\"period\":\"Pamplona/Iruña, España\",\"description\":\"Desarrollo y mantenimiento de aplicaciones web personalizadas para clientes en los sectores de transporte, energía y salud. Elaboración de código limpio y mantenible para cumplir con los requisitos funcionales y visuales. Revisión y aprobación del código desarrollado por el equipo.\"},{\"role\":\"Particular (Autónomo)\",\"company\":\"Septiembre 2014 – Agosto 2016\",\"period\":\"Camaguey, Cuba\",\"description\":\"Desarrollo de páginas web para casas de alquiler (usando WordPress, Symfony, PHP, HTML, CSS y JavaScript). Optimización del rendimiento de los sitios web e implementación de interfaces amigables para mejorar la experiencia del usuario. Aumento de la visibilidad online y las reservas mediante diseño web efectivo y estrategias SEO.\"},{\"role\":\"Proyecto Académico Relevante (Máster)\",\"company\":\"Universidad de Camagüey\",\"period\":\"Camagüey, Cuba\",\"description\":\"Desarrollo de un sistema experto para el diseño de registros de alcantarillado en Camagüey, Cuba, utilizando ReactJS, Java y MySQL. Implementación de la metodología SCRUM y colaboración en la integración de Drools e Hibernate.\"}],\"education\":[{\"role\":
